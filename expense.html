<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Expense Module</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="image/favicon.jfif">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="expense">
  <header class="topbar">
    <a class="brand" href="index.html">
      <span class="brand-mark">DP</span>
      <span>
        <strong>Expense</strong>
        <small>Daily outgoing money</small>
      </span>
    </a>
    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="daily_routing.html">Modules</a>
      <a class="active" href="expense.html">Expense</a>
      <a href="income.html">Income</a>
    </nav>
  </header>

  <main class="shell">
    <section class="module-head expense-head">
      <div>
        <p class="eyebrow">CRUD module</p>
        <h1>Expense records</h1>
      </div>
      <strong id="moduleTotal">₹0</strong>
    </section>

    <section class="crud-layout">
      <form id="entryForm" class="panel form-panel">
        <input type="hidden" id="entryId">
        <div class="panel-title">
          <div>
            <p class="eyebrow">Entry</p>
            <h2 id="formTitle">Add expense</h2>
          </div>
          <button class="ghost-btn" type="button" id="resetBtn">Reset</button>
        </div>
        <label>
          Description
          <input id="descriptionSelect" type="hidden">
          <div class="custom-select" data-select="description">
            <button class="custom-select-btn" type="button">
              <span>Select category</span>
              <b>v</b>
            </button>
            <div class="custom-select-menu">
              <button type="button" data-value="Food"><span class="category-swatch food"></span>Food</button>
              <button type="button" data-value="Hardware"><span class="category-swatch hardware"></span>Hardware</button>
              <button type="button" data-value="Other"><span class="category-swatch other"></span>Other</button>
            </div>
          </div>
          <input id="descriptionOther" class="hidden-field" type="text" placeholder="Enter description">
        </label>
        <label>
          Date
          <div class="date-control">
            <input id="date" type="hidden">
            <button id="dateButton" class="date-button" type="button">Select date</button>
            <div id="datePicker" class="date-picker" aria-label="Calendar"></div>
          </div>
        </label>
        <label>
          Person name
          <input id="person" type="text" placeholder="Optional">
        </label>
        <label>
          Price
          <input id="price" type="number" min="0" step="0.01" placeholder="0" required>
        </label>
        <button class="primary-action full" type="submit">Save expense</button>
      </form>

      <section class="panel table-panel">
        <div class="panel-title">
          <div>
            <p class="eyebrow">List</p>
            <h2>All expenses</h2>
          </div>
          <input id="searchInput" class="search" type="search" placeholder="Search">
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Description</th>
                <th>Date</th>
                <th>Person</th>
                <th>Price</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="entryTable"></tbody>
          </table>
        </div>
      </section>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
