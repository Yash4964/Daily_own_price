<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Daily Price</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="image/favicon.jfif">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login" class="login-page">
  <main class="login-shell">
    <section class="login-panel">
      <div class="login-card-head">
        <span class="brand-mark login-logo"><img src="image/favicon.jfif" alt="Daily Price logo"></span>
        <div>
          <strong>Daily Price</strong>
          <small>Secure account access</small>
        </div>
      </div>
      <div class="login-title">
        <p class="eyebrow">Welcome back</p>
        <h1>Login</h1>
        <p>Enter your email and password to open the dashboard.</p>
      </div>
      <form id="loginForm">
        <label>
          Username
          <input id="loginEmail" type="text" autocomplete="username" placeholder="username" required>
        </label>
        <label>
          Password
          <span class="password-control">
            <input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••••••" required>
            <button class="password-toggle" type="button" data-toggle-password="loginPassword" aria-label="Show password">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M2.5 12s3.5-6 9.5-6 9.5 6 9.5 6-3.5 6-9.5 6-9.5-6-9.5-6Z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </span>
        </label>
        <button id="loginSubmit" class="primary-action full" type="submit">Login</button>
      </form>
      <p class="login-note">Password can be changed from the account menu after login.</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
